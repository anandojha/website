<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background previews</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0d0d}
  .lab{padding:12px 18px;font-size:15px;font-weight:600;color:#fff;background:#111;position:sticky;top:0;z-index:2}
  .lab span{opacity:.6;font-weight:400;margin-left:8px}
  .frame{width:100%;height:560px;border:0;display:block;background:#fff}
</style>
</head>
<body>
  <div class="lab">1 &middot; Pale sage green <span>#eef4f0</span></div>
  <iframe class="frame" src="index.html" data-bg="#eef4f0"></iframe>
  <div class="lab">2 &middot; Cooler grey white <span>#f4f5f7</span></div>
  <iframe class="frame" src="index.html" data-bg="#f4f5f7"></iframe>
  <div class="lab">3 &middot; Warmer beige <span>#f2ebdd</span></div>
  <iframe class="frame" src="index.html" data-bg="#f2ebdd"></iframe>
  <div class="lab">4 &middot; Dark mode <span>#16181a</span></div>
  <iframe class="frame" src="index.html" data-bg="#16181a" data-dark="1"></iframe>
<script>
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument, r = d.documentElement.style;
      if (f.dataset.dark){
        var set = {'--paper':'#16181a','--paper-dark':'#202325','--paper-border':'#33383c','--ink':'#f0efe9','--ink-mid':'#c8c7bf','--ink-light':'#9a998f','--card':'#202325','--card-border':'#33383c','--sage-ultra':'#1e2a24','--sage-pale':'#25352c'};
        for (var k in set) r.setProperty(k, set[k]);
        d.body.style.color = '#f0efe9';
      } else {
        r.setProperty('--paper', f.dataset.bg);
      }
      d.body.style.background = f.dataset.bg;
    }catch(e){}
  });
});
</script>
</body>
</html>
