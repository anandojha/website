<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark background previews</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0d0d}
  .lab{padding:12px 18px;font-size:15px;font-weight:600;color:#fff;background:#000;position:sticky;top:0;z-index:2}
  .lab span{opacity:.6;font-weight:400;margin-left:8px}
  .frame{width:100%;height:600px;border:0;display:block;background:#16181a}
</style>
</head>
<body>
  <div class="lab">A &middot; Dark + mint green <span>accent #57c98a</span></div>
  <iframe class="frame" src="index.html" data-mid="#57c98a" data-forest="#8ee0b4" data-sage="#6cbf97" data-sagelight="#a3d4b8"></iframe>

  <div class="lab">B &middot; Dark + vivid emerald <span>accent #2fbf7a</span></div>
  <iframe class="frame" src="index.html" data-mid="#2fbf7a" data-forest="#63d69f" data-sage="#45b585" data-sagelight="#8fd0af"></iframe>

  <div class="lab">C &middot; Dark + bright sage <span>accent #74d69e</span></div>
  <iframe class="frame" src="index.html" data-mid="#74d69e" data-forest="#9ce6bd" data-sage="#74d69e" data-sagelight="#b0e0c4"></iframe>

<script>
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument, r = d.documentElement.style;
      var base = {
        '--paper':'#16181a','--paper-dark':'#202325','--paper-border':'#2b2f33',
        '--ink':'#f0efe9','--ink-mid':'#c8c7bf','--ink-light':'#9a998f',
        '--card':'#202325','--card-border':'#33383c',
        '--sage-ultra':'#1e2a24','--sage-pale':'#234034'
      };
      base['--forest-mid'] = f.dataset.mid;
      base['--forest'] = f.dataset.forest;
      base['--sage'] = f.dataset.sage;
      base['--sage-light'] = f.dataset.sagelight;
      for (var k in base) r.setProperty(k, base[k]);
      d.body.style.background = '#16181a';
      d.body.style.color = '#f0efe9';
    }catch(e){}
  });
});
</script>
</body>
</html>
